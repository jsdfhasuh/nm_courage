name: Build Docker images

on:
  schedule:
    # GitHub cron uses UTC: 20:00 UTC = 04:00 the next day in Asia/Shanghai.
    - cron: '0 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker-build.yml'
      - '.github/scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - 'compose.yaml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docker-build.yml'
      - '.github/scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - 'compose.yaml'
      - 'dist/**'
      - '*.test.mjs'
      - 'package.json'

# Read-only by default. Only the trusted-main publish job can write packages.
permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  REGISTRY_IMAGE: ghcr.io/jsdfhasuh/nm_courage

jobs:
  test:
    name: Test application
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Run tests and timezone checks
        run: |
          npm test
          TZ=Asia/Shanghai node --test time.test.mjs
          TZ=America/New_York node --test time.test.mjs

  build:
    name: Build linux/${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare image metadata
        id: meta
        run: |
          echo "tag=nm-courage:sha-${GITHUB_SHA::12}-${ARCH}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and load image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            nm-courage:latest-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=牛马鼓励器
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            io.github.actions.run-id=${{ github.run_id }}
            io.github.actions.run-attempt=${{ github.run_attempt }}
          cache-from: type=gha,scope=nm-courage-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nm-courage-${{ matrix.arch }}
      - name: Smoke test image
        env:
          IMAGE: ${{ steps.meta.outputs.tag }}
        run: bash .github/scripts/smoke-test-image.sh "$IMAGE" "$ARCH"
      - name: Test runtime configuration and restricted containers
        env:
          IMAGE: ${{ steps.meta.outputs.tag }}
        run: bash .github/scripts/smoke-test-runtime-config.sh "$IMAGE"
      - name: Export tested image and checksum
        env:
          IMAGE: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p artifacts
          docker save "$IMAGE" "nm-courage:latest-${ARCH}" | gzip -n > "artifacts/nm-courage-linux-${ARCH}.tar.gz"
          (
            cd artifacts
            sha256sum "nm-courage-linux-${ARCH}.tar.gz" > SHA256SUMS
          )
          {
            echo "Image: ${IMAGE}"
            echo "Convenience tag: nm-courage:latest-${ARCH}"
            echo "Platform: linux/${ARCH}"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            docker image inspect "$IMAGE" --format 'Image ID: {{.Id}}'
            echo 'Load: docker load -i nm-courage-linux-'"${ARCH}"'.tar.gz'
            echo 'Run: docker run -d --name nm-courage --restart unless-stopped -p 127.0.0.1:8080:8080 '"${IMAGE}"
          } > artifacts/image-info.txt
      - name: Upload image artifact
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nm-courage-linux-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Summarize download
        env:
          IMAGE: ${{ steps.meta.outputs.tag }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo "### linux/${ARCH} image ready"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- [Download image artifact](${ARTIFACT_URL}) (retained for 7 days)"
            echo '- The ZIP contains the Docker tar.gz, SHA256SUMS and image-info.txt.'
            echo '- Verify the checksum, then use docker load. Trusted main runs publish to GHCR in a separate job; no server is deployed.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish tested images to GHCR
    needs: build
    if: >-
      github.repository == 'jsdfhasuh/nm_courage' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-nm-courage-publish
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Refuse to publish an outdated main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo '::error::main has advanced. Refusing to overwrite latest with an older build; run the current main workflow instead.'
            exit 1
          fi
      - name: Inspect any existing package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response="$RUNNER_TEMP/existing-package.json"
          code=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/users/jsdfhasuh/packages/container/nm_courage)
          case "$code" in
            200)
              repository=$(jq -r '.repository.full_name // empty' "$response")
              if [[ -n "$repository" && "$repository" != "$GITHUB_REPOSITORY" ]]; then
                echo '::error::The existing package belongs to another repository. Refusing to overwrite it.'
                exit 1
              fi
              jq '{name, visibility, repository: .repository.full_name}' "$response"
              ;;
            404)
              echo 'No existing package is accessible to this repository token. GHCR will enforce authorization when creating or pushing the target package.'
              ;;
            *)
              echo "::error::Could not inspect existing package metadata (HTTP ${code}). No image was pushed."
              exit 1
              ;;
          esac
      - name: Download tested images from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nm-courage-linux-*-${{ github.run_id }}-*
          path: tested-images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR with this job's temporary token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested images and multi-architecture tags
        id: publish
        run: |
          sources=()
          for arch in amd64 arm64; do
            # Failed-job retries can reuse successful artifacts from earlier attempts.
            dir=$(find tested-images -mindepth 1 -maxdepth 1 -type d \
              -name "nm-courage-linux-${arch}-${GITHUB_RUN_ID}-*" | sort -V | tail -n 1)
            test -n "$dir"
            (cd "$dir" && sha256sum -c SHA256SUMS)
            docker load -i "$dir/nm-courage-linux-${arch}.tar.gz"
            local_image="nm-courage:sha-${GITHUB_SHA::12}-${arch}"
            test "$(docker image inspect "$local_image" --format '{{.Os}}/{{.Architecture}}')" = "linux/${arch}"
            test "$(docker image inspect "$local_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
            remote_image="${REGISTRY_IMAGE}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${arch}"
            docker tag "$local_image" "$remote_image"
            docker push "$remote_image"
            digest_ref=$(docker image inspect "$remote_image" --format '{{json .RepoDigests}}' \
              | jq -er --arg prefix "${REGISTRY_IMAGE}@" '.[] | select(startswith($prefix))')
            [[ "$digest_ref" =~ @sha256:[0-9a-f]{64}$ ]]
            sources+=("$digest_ref")
          done
          # A retry of an older daily build must not roll back a newer base image
          # even when both runs used the same source commit.
          promote=true
          if docker pull --platform linux/amd64 "${REGISTRY_IMAGE}:latest" > "$RUNNER_TEMP/current-latest.log" 2>&1; then
            current_run=$(docker image inspect "${REGISTRY_IMAGE}:latest" --format '{{index .Config.Labels "io.github.actions.run-id"}}')
            if [[ "$current_run" =~ ^[0-9]+$ ]] && (( current_run > GITHUB_RUN_ID )); then
              promote=false
              echo "A newer run (${current_run}) already owns latest. Publishing this build's specific tag only."
            fi
          elif ! grep -Eiq 'manifest unknown|manifest_unknown|no such manifest|name unknown' "$RUNNER_TEMP/current-latest.log"; then
            cat "$RUNNER_TEMP/current-latest.log"
            echo '::error::Could not check the current latest tag; refusing to overwrite it.'
            exit 1
          fi
          tags=(--tag "${REGISTRY_IMAGE}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [[ "$promote" == true ]]; then
            tags+=(--tag "${REGISTRY_IMAGE}:latest" --tag "${REGISTRY_IMAGE}:sha-${GITHUB_SHA}")
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            | tee "$RUNNER_TEMP/published-manifest.txt"
          digest=$(sed -n 's/^Digest:[[:space:]]*//p' "$RUNNER_TEMP/published-manifest.txt")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo '### GHCR image published'
            echo "- Image: \`${REGISTRY_IMAGE}:latest\`"
            echo "- Source tag: \`${REGISTRY_IMAGE}:sha-${GITHUB_SHA}\`"
            echo "- Exact image: \`${REGISTRY_IMAGE}@${digest}\`"
            echo "- Updated latest and source tags: ${promote}"
            echo '- Public availability is checked separately using anonymous pulls.'
          } >> "$GITHUB_STEP_SUMMARY"

  verify-public:
    name: Verify anonymous linux/${{ matrix.arch }} pull
    needs: publish
    if: needs.publish.outputs.digest != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      ARCH: ${{ matrix.arch }}
      PUBLISHED_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Check out smoke test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify public manifest and pull without registry credentials
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          if ! docker manifest inspect "${REGISTRY_IMAGE}:latest" > "$RUNNER_TEMP/public-manifest.json"; then
            echo '::error::Anonymous GHCR access failed. If this is the first publication, set the nm_courage package visibility to Public in GitHub package settings, then rerun failed jobs. No personal access token is needed.'
            exit 1
          fi
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' \
            "$RUNNER_TEMP/public-manifest.json"
          docker manifest inspect "${REGISTRY_IMAGE}@${PUBLISHED_DIGEST}" > "$RUNNER_TEMP/published-manifest.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' \
            "$RUNNER_TEMP/published-manifest.json"
          docker pull --platform "linux/${ARCH}" "${REGISTRY_IMAGE}@${PUBLISHED_DIGEST}"
          test "$(docker image inspect "${REGISTRY_IMAGE}@${PUBLISHED_DIGEST}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          bash .github/scripts/smoke-test-image.sh "${REGISTRY_IMAGE}@${PUBLISHED_DIGEST}" "$ARCH"
          {
            echo "### Anonymous linux/${ARCH} pull passed"
            echo "- Verified both architectures in the public latest manifest."
            echo "- Pulled and ran \`${REGISTRY_IMAGE}@${PUBLISHED_DIGEST}\` without registry credentials."
          } >> "$GITHUB_STEP_SUMMARY"

