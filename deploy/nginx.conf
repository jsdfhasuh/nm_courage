server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Explicit .mjs support is required for browser ES modules.
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/x-icon ico;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-cache" always;

    # The entrypoint writes only whitelisted defaults here, including on read-only roots.
    location = /runtime-config.json {
        alias /tmp/nm-courage/runtime-config.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

